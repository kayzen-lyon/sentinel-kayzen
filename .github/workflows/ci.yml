name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Qualité (types, lint, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Lint (ESLint + eslint-plugin-security)
        run: npm run lint
      - name: Tests unitaires
        run: npm test
      - name: Tests worker (normaliseur OSS)
        run: python3 worker/github-actions/test_push_oss.py
      - name: Build
        run: npm run build

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install semgrep
      - name: Semgrep scan (rulesets OSS)
        run: |
          semgrep scan \
            --config p/typescript \
            --config p/react \
            --config p/nextjs \
            --config p/javascript \
            --config p/secrets \
            --config p/owasp-top-ten \
            --sarif --output semgrep.sarif
      # SARIF archivé en artefact (gratuit, dépôt privé OK). Pour l'onglet Security,
      # activez le code scanning (dépôt public ou GitHub Advanced Security) puis
      # remplacez cette étape par github/codeql-action/upload-sarif@v3.
      - name: Archiver le SARIF Semgrep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deps:
    name: Dépendances (osv-scanner + npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: npm audit (prod, échoue sur high+)
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: OSV-Scanner (informatif)
        continue-on-error: true
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@latest
          "$(go env GOPATH)/bin/osv-scanner" --lockfile=package-lock.json
