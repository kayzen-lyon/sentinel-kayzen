name: strix-security

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  security-scan:
    # Les PR de Dependabot n'ont pas accès aux secrets : le scan y échouerait à coup sûr.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Strix
        run: pip install strix-agent

      - name: Run Strix on the pull request
        env:
          STRIX_LLM: ${{ vars.STRIX_MODEL || 'gemini/gemini-3.8-flash' }}
          LLM_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Le niveau gratuit de Gemini peut répondre lentement aux heures chargées.
          LLM_PREFLIGHT_TIMEOUT: "120"
        # Exit code 2 si des vulnérabilités sont trouvées → le check PR échoue.
        # Si le modèle est saturé (échec de connexion avant tout scan), on essaie les modèles de
        # secours, en deux passes. Tout autre échec, y compris des vulnérabilités, arrête le job.
        run: |
          set -o pipefail
          for passe in 1 2; do
            for modele in "$STRIX_LLM" gemini/gemini-3.6-flash gemini/gemini-3.5-flash-lite; do
              echo "Passe $passe, modèle $modele"
              code=0
              STRIX_LLM="$modele" strix -n -t ./ --scan-mode quick 2>&1 | tee "$RUNNER_TEMP/strix.log" || code=$?
              if [ "$code" -eq 0 ] || ! grep -q "LLM CONNECTION FAILED" "$RUNNER_TEMP/strix.log"; then
                exit "$code"
              fi
            done
            if [ "$passe" -eq 1 ]; then sleep 60; fi
          done
          echo "::error::Aucun modèle Gemini disponible : le scan n'a pas eu lieu."
          exit 1
